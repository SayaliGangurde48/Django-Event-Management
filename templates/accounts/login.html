<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F2E9DC;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #FAF9F6;
            width: 400px;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(74,52,40,0.12);
        }

        h1 {
            color: #4A3428;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #80634F;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #4A3428;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #D8C3A5;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4A3428;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #80634F;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #80634F;
        }

        a {
            color: #4A3428;
            font-weight: bold;
        }

        .errors {
            color: #80634F;
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="login-container">

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Student Event Management System
    </p>

    <form method="POST">

        {% csrf_token %}

        {% if form.errors %}
            <div class="errors">
                Invalid username or password.
                Please try again.
            </div>
        {% endif %}

        <label>Username</label>
        {{ form.username }}

        <label>Password</label>
        {{ form.password }}

        <button type="submit">Login</button>

    </form>

    <p class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

</body>
</html>
